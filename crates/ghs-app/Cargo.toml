[package]
name = "ghs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# M2: the shell drives one engine session. Protocol types are reached through
# `ghs-engine` re-exports, never by writing bytes from the app.
ghs-core.workspace = true
ghs-engine.workspace = true
ghs-demo.workspace = true
ghs-serial.workspace = true
ghs-gcode.workspace = true
ghs-viewer.workspace = true
ghs-config.workspace = true
ghs-i18n.workspace = true
ghs-probe.workspace = true

# Local wall-clock formatting for the local-only job history.
chrono.workspace = true

# Non-fatal diagnostics for local persistence failures.
tracing.workspace = true

# Pinned by the workspace. Keep GPUI behind this facade so a future `ghs-ui`
# crate can own the version churn (see docs/adr/0004-gpui-ui-layer.md).
gpui-kit.workspace = true
