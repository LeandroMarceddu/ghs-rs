[workspace]
resolver = "3"
members = [
  "crates/ghs-core",
  "crates/ghs-proto",
  "crates/ghs-serial",
  "crates/ghs-sim",
  "crates/ghs-engine",
  "crates/ghs-viewer",
  "crates/ghs-app",
]
default-members = ["crates/ghs-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeandroMarceddu/ghs-rs"
authors = ["Leandro Marceddu"]

[workspace.dependencies]
ghs-core = { path = "crates/ghs-core" }
ghs-proto = { path = "crates/ghs-proto" }
ghs-serial = { path = "crates/ghs-serial" }
ghs-sim = { path = "crates/ghs-sim" }
ghs-engine = { path = "crates/ghs-engine" }
ghs-viewer = { path = "crates/ghs-viewer" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serialport = "4.10"
gpui-kit = "0.8.1"
crossbeam-channel = "0.5"
glam = "0.34"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
